# Pushing a vX.Y.Z tag builds both editions of the key and the Windows installer,
# then publishes them in a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The published file names are fixed: the installer and make-key.sh always download
# .../releases/latest/download/claude-recovery-<edition>.iso
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    name: Image ${{ matrix.edition }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [entreprise, particulier]
    container:
      image: debian:trixie
      # live-build mounts /proc, /sys and /dev in the chroot it builds
      options: --privileged
    steps:
      - name: Build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build git ca-certificates curl cpio xz-utils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the image
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          build/build-iso.sh ${{ matrix.edition }}
          ls -lh build/out
          ( cd build/out && sha256sum -c ./*.sha256 )
      - uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.edition }}
          path: build/out/claude-recovery-${{ matrix.edition }}.iso*
          compression-level: 0
          retention-days: 3

  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: powershell
        run: .\installer\build.ps1 -Version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/out/ClaudeRecoveryInstaller.exe
          retention-days: 3

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [iso, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          # Running the workflow again on a published tag replaces the release's files.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Claude Recovery $TAG" \
              --generate-notes
          fi
