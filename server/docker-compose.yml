# Ctrl-Z services on the company's server (business edition):
#   forgejo       configuration repository pulled by the keys (git pull at every session)
#   log-receiver  receives the session logs and the job reports
#
# No port is published: Caddy (already in place) reaches both services through the
# Docker network ${CADDY_NETWORK}. See README.md and Caddyfile.snippet.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-17}
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__DOMAIN: ${GIT_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${GIT_DOMAIN}/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: private
    volumes:
      - ./data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    networks: [proxy]

  log-receiver:
    build: ./log-receiver
    container_name: log-receiver
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
    volumes:
      - ./data/logs:/data
      - ./tokens.txt:/config/tokens.txt:ro
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${CADDY_NETWORK}
